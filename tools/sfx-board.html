<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>효과음 보드</title>
<style>
:root { color-scheme: dark; --bg:#0f1015; --card:#1c1e25; --fg:#e8e6e1; --mut:#8a8f9c; --acc:#5fcde4; --warm:#df7126; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
header { padding: 12px 16px; border-bottom: 1px solid #262932; }
header p { margin: 4px 0 0; color: var(--mut); font-size: 13px; }
main { padding: 12px 16px 40px; max-width: 900px; }
h2 { font-size: 14px; color: var(--mut); margin: 22px 0 8px; font-weight: 600; }
.row { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.row.cand { border-left: 3px solid var(--warm); }
button.play { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #2b2f3a; color: var(--fg); font-size: 18px; cursor: pointer; }
button.play:active, button.play.on { background: var(--acc); color: #0f1015; }
.txt { flex: 1; min-width: 0; }
.txt b { font-weight: 600; }
.txt small { display: block; color: var(--mut); font-size: 12px; word-break: break-all; }
.ms { color: var(--mut); font-size: 12px; flex: none; }
.ctx { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.ctx button { background: #2b2f3a; color: var(--fg); border: 0; border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <b>효과음 보드 — Demo 0 (리얼 사운드 v3)</b>
  <p>눌러서 들어 보세요. 주황 줄이 후보입니다(같은 자리에 하나만 남김). 휴대폰은 무음 모드를 꺼 주세요.</p>
  <div class="ctx">
    <button id="seqParry">흐름 듣기: 수호체 신호 → 0.13초 뒤 패링 성공 (신호 3 × 성공 4 조합 차례로)</button>
  </div>
</header>
<main id="m"></main>
<script>
const BASE = '/export/sfx/';
const cache = {};
const play = id => { const a = cache[id] || (cache[id] = new Audio(BASE + id + '.wav')); a.currentTime = 0; a.play(); };
(async () => {
  const list = await (await fetch(BASE + 'index.json?t=' + Date.now())).json();
  const m = document.getElementById('m'); let group = '';
  for (const s of list) {
    if (s.group !== group) { group = s.group; const h = document.createElement('h2'); h.textContent = group; m.append(h); }
    const r = document.createElement('div'); r.className = 'row' + (s.candidate ? ' cand' : '');
    const b = document.createElement('button'); b.className = 'play'; b.textContent = '▶'; b.onclick = () => { play(s.id); b.classList.add('on'); setTimeout(() => b.classList.remove('on'), s.ms); };
    const t = document.createElement('div'); t.className = 'txt'; t.innerHTML = `<b></b><small></small>`;
    t.querySelector('b').textContent = s.label; t.querySelector('small').textContent = s.id + (s.note ? ' · ' + s.note : '') + (s.sources ? ' · 재료: ' + s.sources.join(', ') : '');
    const ms = document.createElement('span'); ms.className = 'ms'; ms.textContent = s.ms + 'ms';
    r.append(b, t, ms); m.append(r);
  }
  // 실제 흐름: 신호음(windup:cue) 시작 후 ~133ms 안에 공격이 오고, 그때 패링 → 성공음
  document.getElementById('seqParry').onclick = async () => {
    for (const cue of ['a', 'b', 'c']) for (const ps of ['a', 'b', 'c', 'd']) {
      play('sentinel-cue-' + cue); await new Promise(r => setTimeout(r, 130)); play('parry-success-' + ps); await new Promise(r => setTimeout(r, 900));
    }
  };
})();
</script>
</body>
</html>
